name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC: GitHub obtiene credenciales temporales de AWS, sin access keys guardadas
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Archivos con hash en el nombre: caché de un año. El resto (HTML, imágenes): siempre revalidar.
      - name: Upload to S3
        run: |
          aws s3 sync dist/_astro "s3://${{ vars.S3_BUCKET }}/_astro" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

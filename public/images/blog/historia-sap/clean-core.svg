<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t">
  <title id="t">Clean core: el núcleo estándar de S/4HANA rodeado por SAP BTP con CAP, Fiori, Integration y Joule, conectado a sistemas no-SAP, AWS, Azure y GCP</title>
  <style>
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; }
    .sans { font-family: 'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif; }
    .pill { fill: #0d0f12; stroke: #2f6475; stroke-width: 2; }
    .pill-t { font-size: 19px; font-weight: 600; fill: #e8e6e1; }
    .ext { fill: #15181d; stroke: #3a3f47; stroke-width: 2; }
    .ext-t { font-size: 19px; fill: #c9c7c2; }
    .wire { stroke: #3a3f47; stroke-width: 2; }
    .dash { stroke: #2f6475; stroke-width: 2; stroke-dasharray: 5 6; }
  </style>
  <rect width="1200" height="690" fill="#0d0f12"/>

  <text x="60" y="70" class="mono" font-size="20" fill="#7d848d">// clean core</text>
  <text x="60" y="118" class="sans" font-size="38" font-weight="700" fill="#e8e6e1">El núcleo limpio, lo propio en BTP</text>

  <!-- BTP ring -->
  <rect x="300" y="190" width="600" height="385" rx="28" fill="#121a1e" stroke="#5cc8e8" stroke-width="2"/>
  <text x="328" y="228" class="mono" font-size="19" fill="#5cc8e8">SAP BTP · extensiones</text>

  <!-- core -->
  <rect x="450" y="262" width="300" height="150" rx="12" fill="#15181d" stroke="#f5c84c" stroke-width="2.5"/>
  <g text-anchor="middle">
    <text x="600" y="332" class="sans" font-size="34" font-weight="700" fill="#e8e6e1">S/4HANA</text>
    <text x="600" y="368" class="mono" font-size="18" fill="#f5c84c">núcleo estándar</text>
  </g>

  <!-- core → extensions -->
  <line x1="384" y1="440" x2="384" y2="490" class="dash"/>
  <line x1="528" y1="440" x2="528" y2="490" class="dash"/>
  <line x1="672" y1="440" x2="672" y2="490" class="dash"/>
  <line x1="816" y1="440" x2="816" y2="490" class="dash"/>
  <line x1="384" y1="440" x2="816" y2="440" class="dash"/>
  <line x1="600" y1="412" x2="600" y2="440" class="dash"/>

  <g text-anchor="middle">
    <rect x="319" y="490" width="130" height="56" rx="28" class="pill"/>
    <text x="384" y="525" class="sans pill-t">CAP</text>
    <rect x="463" y="490" width="130" height="56" rx="28" class="pill"/>
    <text x="528" y="525" class="sans pill-t">Fiori</text>
    <rect x="607" y="490" width="130" height="56" rx="28" class="pill"/>
    <text x="672" y="525" class="sans pill-t">Integration</text>
    <rect x="751" y="490" width="130" height="56" rx="28" class="pill"/>
    <text x="816" y="525" class="sans pill-t">Joule</text>
  </g>

  <!-- external systems -->
  <line x1="240" y1="382" x2="300" y2="382" class="wire"/>
  <line x1="900" y1="312" x2="960" y2="312" class="wire"/>
  <line x1="900" y1="382" x2="960" y2="382" class="wire"/>
  <line x1="900" y1="452" x2="960" y2="452" class="wire"/>

  <g text-anchor="middle">
    <rect x="60" y="342" width="180" height="80" rx="10" class="ext"/>
    <text x="150" y="376" class="sans ext-t">Sistemas</text>
    <text x="150" y="402" class="sans ext-t">no-SAP</text>
    <rect x="960" y="288" width="180" height="48" rx="10" class="ext"/>
    <text x="1050" y="319" class="mono ext-t">AWS</text>
    <rect x="960" y="358" width="180" height="48" rx="10" class="ext"/>
    <text x="1050" y="389" class="mono ext-t">Azure</text>
    <rect x="960" y="428" width="180" height="48" rx="10" class="ext"/>
    <text x="1050" y="459" class="mono ext-t">GCP</text>
  </g>

  <text x="600" y="636" text-anchor="middle" class="mono" font-size="17" fill="#7d848d">El núcleo se actualiza sin romper los desarrollos: lo propio vive fuera.</text>
</svg>
